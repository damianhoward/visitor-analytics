name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Calls the shared reusable pipeline. CodeQL and dependency-review used to be absent here by
# constraint — both need GitHub Advanced Security, which a private repository does not get on the
# free plan. This repository is public now, so both run and neither is an exception any more.
#
# upload-coverage stays off until a Codecov project exists and CODECOV_TOKEN is set. That is the
# only remaining difference from the other public repositories, and it is a missing credential
# rather than a decision.
jobs:
  build:
    uses: damian1000/.github/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      upload-coverage: false
