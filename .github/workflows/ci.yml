name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Calls the shared reusable pipeline. CodeQL and dependency-review are absent by constraint,
# not oversight: both need GitHub Advanced Security on a private repository. OWASP
# dependency-check covers the dependency side locally (./gradlew dependencyCheckAnalyze).
# upload-coverage is off — this private repo has no Codecov.
jobs:
  build:
    uses: damian1000/.github/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      upload-coverage: false
