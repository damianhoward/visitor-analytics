name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Calls the shared reusable pipeline with no inputs at all, which is now the whole point: this
# file is byte-identical to every other service's caller. CodeQL, dependency-review and the
# coverage upload were all absent here by constraint rather than choice — the first two need
# GitHub Advanced Security and the third needs a Codecov project, and a private free-plan
# repository gets neither. Going public removed the constraint, so the variance goes with it.
#
# upload-coverage defaults to true, so it is not passed. An input restated at its default is a
# difference a reader has to check, and the estate's rule is that shared configuration stays
# identical and variance moves into the build.
jobs:
  build:
    uses: damianhoward/.github/.github/workflows/ci.yml@main
    secrets: inherit
