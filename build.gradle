// Visitor analytics for the live sites: tails Caddy's JSON access logs, enriches each request
// (GeoLite2 location/ASN, device class, salted IP hash — never the raw address), stores visits
// in the Autonomous DB, and serves an authenticated admin dashboard.
plugins {
    id 'com.damianhoward.kotlin-conventions' version '0.5.3'
    id 'application'
}

group = 'com.damianhoward'
version = '1.0.0'

application {
    applicationName = 'visitor-analytics'
    mainClass = 'com.damianhoward.visitoranalytics.MainKt'
}

dependencies {
    // Caddy log lines are nested third-party JSON; geoip2 already carries jackson-databind, so
    // the parser is declared explicitly rather than leaned on transitively.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'com.maxmind.geoip2:geoip2:5.2.0'
    implementation deps.flyway.core
    runtimeOnly deps.flyway.oracle
    runtimeOnly deps.oracle.jdbc
    // Reads the Autonomous DB's auto-login wallet (cwallet.sso) for mutual TLS.
    runtimeOnly deps.oracle.pki
    // Flyway and geoip2 log via slf4j; a binding routes warnings to stderr -> journalctl.
    runtimeOnly deps.slf4j.simple

    testImplementation deps.hamcrest
    // Rollup SQL runs against H2 in Oracle compatibility mode; one live smoke covers real-dialect drift.
    testImplementation deps.h2
    testRuntimeOnly deps.oracle.jdbc
    testRuntimeOnly deps.oracle.pki
    // Same version as risk-engine's browser test, the estate's other Playwright consumer.
    testImplementation 'com.microsoft.playwright:playwright:1.61.0'
}

// Downloads the Chromium build DashboardBrowserTest drives (a no-op when already present).
// Wired into test so `check` is self-sufficient — no bespoke CI install step.
tasks.register('installPlaywrightChromium', JavaExec) {
    classpath = configurations.testRuntimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', '--with-deps', 'chromium'
}

test.dependsOn installPlaywrightChromium

// Only the process entry point (MainKt — main() wires the real log paths/DB/port and blocks) is
// excluded. The rest — tailer, parser, filter, enrichers, stores, pruner, admin server — is
// exercised by tests and counted.
coverageExcludes = ['**/visitoranalytics/MainKt.class']